app-id: com.nextcloud.desktopclient.nextcloud

runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk

command: nextcloud

finish-args:
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --share=ipc
  - --filesystem=host:rw
  - --filesystem=xdg-run/Nextcloud:create
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=com.nextcloudgmbh.Nextcloud
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --env=TMPDIR=/var/tmp

cleanup:
  - /lib/*.a
  - /lib/*.la
  - /lib/x86_64-linux-gnu/pkgconfig
  - /share/doc
  - /share/icons/hicolor/1024x1024

modules:

  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TRANSLATIONS=NO
      - -DBUILD_WITH_QT6=1
    cleanup:
      - /include
      - /mkspecs
      - /lib/cmake
    sources:
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/0.15.0.tar.gz
        sha256: f4254dc8f0933b06d90672d683eab08ef770acd8336e44dfa030ce041dc2ca22
        x-checker-data:
          type: anitya
          url-template: https://github.com/frankosterfeld/qtkeychain/archive/$version.tar.gz
          stable-only: true
          project-id: 4138

  - name: rsvg-convert-shim
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin && ln -s /usr/bin/rsvg-convert /app/bin/inkscape
    cleanup:
      - '*'

  - name: libcloudproviders
    buildsystem: meson
    config-opts:
      - -Dvapigen=false
      - -Dintrospection=false
    cleanup:
      - /include
    sources:
      - type: git
        url: https://gitlab.gnome.org/World/libcloudproviders.git
        tag: 0.4.0
        commit: 510f0eee666e4f99e8b11eb55945347db371b47c
        x-checker-data:
          type: anitya
          tag-template: $version
          stable-only: true
          project-id: 21207

  - name: libp11
    config-opts:
      - --with-enginesdir=${FLATPAK_DEST}/lib/engines-3/
      - --with-modulesdir=${FLATPAK_DEST}/lib/ossl-modules/
    cleanup:
      - /include
    sources:
      - type: archive
        url: https://github.com/OpenSC/libp11/releases/download/libp11-0.4.20/libp11-0.4.20.tar.gz
        sha256: a125e0310ff10c189fc1b32a9652101486ea94a6b07c677a30e90e3638d2db48
        x-checker-data:
          type: anitya
          url-template: https://github.com/OpenSC/libp11/releases/download/libp11-$version/libp11-$version.tar.gz
          stable-only: true
          project-id: 1699

  - name: KDSingleApplication
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DKDSingleApplication_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/KDAB/KDSingleApplication/releases/download/v1.2.1/kdsingleapplication-1.2.1.tar.gz
        sha256: e3254ce9dc5ecf6d61ef83264bc61d486a307f0e3c9ed1bb2176f068cdbcbe09
        x-checker-data:
          type: anitya
          project-id: 370439
          url-template: https://github.com/KDAB/KDSingleApplication/releases/download/v$version/kdsingleapplication-$version.tar.gz

  - name: nextcloud-client
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHELL_INTEGRATION_DOLPHIN=0
      - -DBUILD_UPDATER=OFF
      - -DPLUGIN_INSTALL_DIR=/app/lib/plugins
      - -DPLUGINDIR=/app/lib/plugins
      - -DQT_MAJOR_VERSION=6
    cleanup:
      - /include
    post-install:
      - install -Dm644 -t /app/share/metainfo com.nextcloud.desktopclient.nextcloud.metainfo.xml
    sources:
      - type: git
        url: https://github.com/nextcloud/desktop.git
        tag: v34.0.2
        commit: ea499374cb8d097a23a75fac844775a6b3a69036
        x-checker-data:
          type: json
          url: https://api.github.com/repos/nextcloud/desktop/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^[vV]"; "")
          timestamp-query: .published_at
      - type: patch
        path: dbus-service-path.patch
      - type: patch
        path: icon-name.patch
      - type: patch
        path: sync-icons.patch
      - type: file
        path: com.nextcloud.desktopclient.nextcloud.metainfo.xml
